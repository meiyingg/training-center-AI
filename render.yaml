services:
  - type: web
    name: training-center
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
    disk:
      name: training-center-data
      mountPath: /app/data
      sizeGB: 1
